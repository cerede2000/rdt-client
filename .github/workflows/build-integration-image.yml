name: Build Integration Docker Image

# Fork-only workflow: builds a test image from the `integration` branch and
# publishes it to GHCR as `:integration` so changes can be tried out before
# opening a pull request upstream. Not intended to be part of any upstream PR.

on:
  push:
    branches:
      - integration
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rdtclient
  TAG: integration
  # Version stamped into the build so the app does not show a bogus
  # "update available" banner (upstream stamps this from the release tag).
  APP_VERSION: 2.0.140

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    outputs:
      digest-amd64: ${{ steps.digest.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.digest.outputs.digest-arm64 }}
    strategy:
      matrix:
        config:
          - arch: amd64
            runs-on: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.config.runs-on }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Stamp version into .csproj
        run: |
          sed -i "s|<Version>.*</Version>|<Version>${APP_VERSION}</Version>|" server/RdtClient.Web/RdtClient.Web.csproj
          sed -i "s|<AssemblyVersion>.*</AssemblyVersion>|<AssemblyVersion>${APP_VERSION}</AssemblyVersion>|" server/RdtClient.Web/RdtClient.Web.csproj

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.config.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,name=${{ env.IMAGE }}

      - name: Export digest
        id: digest
        run: echo "digest-${{ matrix.config.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push manifest list
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ env.TAG }} \
            ${{ env.IMAGE }}@${{ needs.build.outputs.digest-amd64 }} \
            ${{ env.IMAGE }}@${{ needs.build.outputs.digest-arm64 }}

      - name: Inspect pushed image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ env.TAG }}

      - name: Job summary
        run: |
          {
            echo "### Integration image published"
            echo ""
            echo "\`docker pull ${{ env.IMAGE }}:${{ env.TAG }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
